# QShield-X CI: the same steps as `make ci` locally. Toolchain pins: ci/setup_tools.sh, ENVIRONMENT.md.
name: ci
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: system packages
        run: sudo apt-get update -q && sudo apt-get install -y -q clang g++
      - name: cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            .tools
            .venv
          key: tools-${{ runner.os }}-${{ hashFiles('ci/setup_tools.sh', 'requirements.txt') }}
      - name: install pinned toolchain
        run: ci/setup_tools.sh
      - name: lint
        run: make lint
      - name: unit tests (C++ golden model, Python, infra)
        run: make test
      - name: small co-simulation (RTL vs HwModel, d=3,5)
        run: make cosim-quick
      - name: small formal job (SymbiYosys k-induction, TLC)
        run: make formal-quick
