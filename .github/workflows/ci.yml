# QShield-X CI. The same steps run locally via `make ci` (see BLOCKERS.md B1: no hosted remote).
name: ci
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/qshieldx/toolchain:2026-10-24   # built from infra/docker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: lint
        run: make lint
      - name: unit tests (C++ golden model, Python, infra)
        run: make test
      - name: small co-simulation (RTL vs HwModel, d=3,5)
        run: make cosim-quick
      - name: small formal job (SymbiYosys BMC/k-induction, TLC)
        run: make formal-quick
